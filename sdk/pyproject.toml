[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["complianceki"]

[project]
name = "complianceki-sdk"
version = "0.1.0"
description = "Python SDK for ComplianceKI — deterministic, LLM-free GDPR & EU AI Act compliance scanning."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Slaveyko Kirilov Nikolov", email = "info@totema.de" },
]
maintainers = [
    { name = "ComplianceKIbot.de", email = "info@totema.de" },
]
keywords = ["compliance", "gdpr", "dsgvo", "eu-ai-act", "scanner", "sast", "security", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://compliancekibot.de"
Repository = "https://github.com/compliancekibot/complianceki-docs"
Documentation = "https://compliancekibot.de/docs"
Changelog = "https://github.com/compliancekibot/complianceki-docs/blob/main/CHANGELOG.md"
