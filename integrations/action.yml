name: 'ComplianceKI Scan'
description: 'Scan a repository for GDPR (DSGVO) and EU AI Act compliance with ComplianceKIbot.de — deterministic, LLM-free.'
author: 'compliancekibot'
branding:
  icon: 'shield-check'
  color: 'blue'
inputs:
  api-key:
    description: 'ComplianceKI API key (sent as the X-API-Key header).'
    required: true
  base-url:
    description: 'ComplianceKI API base URL.'
    required: false
    default: 'https://api.compliancekibot.de'
  mode:
    description: 'Scan mode: assessment_only (default) or full_implementation.'
    required: false
    default: 'assessment_only'
  fail-on:
    description: 'Fail the job on findings at/above this severity (critical|high|medium|low|info). Leave empty to never fail.'
    required: false
    default: 'high'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install ComplianceKI SDK
      shell: bash
      run: python -m pip install --quiet --disable-pip-version-check complianceki-sdk
    - name: Run compliance scan
      shell: bash
      env:
        COMPLIANCEKI_API_KEY: ${{ inputs.api-key }}
        COMPLIANCEKI_BASE_URL: ${{ inputs.base-url }}
        COMPLIANCEKI_MODE: ${{ inputs.mode }}
        COMPLIANCEKI_FAIL_ON: ${{ inputs.fail-on }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SHA: ${{ github.sha }}
      run: python "${{ github.action_path }}/scan.py"
